name: PhyGEC-Net CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub Editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check Module Imports
      run: |
        # Verify that key Python modules and models can be imported successfully
        python -c "import src.models.phygec_net as m; print('phygec_net imported successfully')"
        python -c "import src.models.itransformer as m; print('itransformer imported successfully')"
        python -c "import src.models.timexer as m; print('timexer imported successfully')"
        python -c "import src.models.tft as m; print('tft imported successfully')"
        python -c "import src.data_processor as dp; print('data_processor imported successfully')"
        python -c "import src.dataset as ds; print('dataset imported successfully')"
        python -c "import src.metrics as mt; print('metrics imported successfully')"
